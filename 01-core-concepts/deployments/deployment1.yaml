---
apiVersion: apps/v1
kind: Deployment 
metadata:
  name: nginx-deployment
  labels:
    app: nginx
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      labels:
        app: nginx
        version: v1
  template:
    metadata:
      name: nginx-pod
      labels:
        app: nginx
        version: apps/v1
    spec:
      containers:
        - name: nginx
          image: nginx:1.14.2
          ports:
            - containerPort: 80



